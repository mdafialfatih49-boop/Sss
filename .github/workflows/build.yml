name: Build Abyssal Colossus

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Abyssal Colossus
        run: |
          unzip -q Abyssal-Colossus-Fabric-1.20.1-Source.zip -d abyssal-colossus

      - name: Locate Gradle Project
        shell: bash
        run: |
          PROJECT_DIR=$(find abyssal-colossus -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "Gradle settings file not found!"
            find abyssal-colossus -maxdepth 5 -type f
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found project: $PROJECT_DIR"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle 8.8
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.8

      - name: Build Abyssal Colossus
        run: gradle build
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Upload Abyssal Colossus JAR
        uses: actions/upload-artifact@v4
        with:
          name: Abyssal-Colossus-Fabric-1.20.1
          path: ${{ env.PROJECT_DIR }}/build/libs/*.jar
