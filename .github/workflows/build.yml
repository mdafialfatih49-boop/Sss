
name: build

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extract Milk Update
        run: unzip -q MilkUpdate_Fabric_1.20.1_Source.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.8

      - name: Build Milk Update
        run: gradle build
        working-directory: MilkUpdate_Fabric_1.20.1

      - uses: actions/upload-artifact@v4
        with:
          name: MilkUpdate-Fabric-1.20.1
          path: MilkUpdate_Fabric_1.20.1/build/libs/*.jar
