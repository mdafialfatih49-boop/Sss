name: build

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extract The Crowley Mod
        run: unzip -q The-Crowley-Fabric-1.20.1-Source.zip -d the-crowley-mod

      - name: Locate Gradle Project
        shell: bash
        run: |
          SETTINGS_FILE=$(find the-crowley-mod -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "Gradle settings file not found!"
            find the-crowley-mod -maxdepth 5 -type f
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found project: $PROJECT_DIR"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.8

      - name: Build The Crowley Mod
        run: gradle build --no-daemon
        working-directory: ${{ env.PROJECT_DIR }}

      - uses: actions/upload-artifact@v4
        with:
          name: The-Crowley-Fabric-1.20.1
          path: ${{ env.PROJECT_DIR }}/build/libs/*.jar
