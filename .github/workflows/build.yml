name: Build Giganto Apes Mod

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check Source ZIP
        run: |
          if [ ! -f "gigantoapes-mod.zip" ]; then
            echo "Source ZIP not found!"
            echo "Files in repository:"
            ls -la
            exit 1
          fi

      - name: Extract Giganto Apes Mod
        run: |
          unzip -q gigantoapes-mod.zip -d giganto-apes-mod

      - name: Locate Gradle Project
        shell: bash
        run: |
          PROJECT_DIR=$(find giganto-apes-mod \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "Gradle settings file not found!"
            find giganto-apes-mod -maxdepth 5 -type f
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found project: $PROJECT_DIR"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle 8.8
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.8

      - name: Build Giganto Apes Mod
        run: gradle build
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Upload Giganto Apes Mod
        uses: actions/upload-artifact@v4
        with:
          name: Giganto-Apes-Fabric-1.20.1
          path: ${{ env.PROJECT_DIR }}/build/libs/*.jar
          if-no-files-found: error
